version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: dt12_dulichso_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dt12_dulichso
      MYSQL_ROOT_PASSWORD: root_password_dt12
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  python-absa:
    build:
      context: ./python-service
    container_name: dt12_dulichso_python_absa
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001

  backend:
    image: php:8.2-cli
    container_name: dt12_dulichso_backend
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - python-absa
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    image: node:20-alpine
    container_name: dt12_dulichso_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
